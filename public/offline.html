<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#f6f3ec" />
    <title>Offline · Craffé</title>
    <!--
      Served by the service worker when a page load fails. It has to stand on
      its own: no build CSS or fonts are guaranteed to be cached, so the brand
      tokens from globals.css are repeated inline.
    -->
    <style>
      * {
        box-sizing: border-box;
      }
      html,
      body {
        height: 100%;
        margin: 0;
      }
      body {
        display: grid;
        place-items: center;
        padding: 24px;
        background: #f6f3ec;
        color: #2b2a28;
        font-family: Outfit, ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
        -webkit-font-smoothing: antialiased;
        text-align: center;
      }
      main {
        max-width: 22rem;
      }
      .mark {
        display: grid;
        place-items: center;
        width: 80px;
        height: 80px;
        margin: 0 auto;
        border-radius: 50%;
        background: #efeae0;
        color: #9a9186;
      }
      h1 {
        margin: 20px 0 0;
        font-size: 22px;
        font-weight: 700;
        letter-spacing: -0.01em;
      }
      p {
        margin: 8px 0 0;
        font-size: 15px;
        line-height: 1.6;
        color: #6b6459;
      }
      button {
        height: 48px;
        margin-top: 24px;
        padding: 0 28px;
        border: 0;
        border-radius: 999px;
        background: #2b2a28;
        color: #f6f3ec;
        font: inherit;
        font-size: 15px;
        font-weight: 600;
        cursor: pointer;
        touch-action: manipulation;
        transition: transform 160ms cubic-bezier(0.23, 1, 0.32, 1);
      }
      button:active {
        transform: scale(0.97);
      }
      button:focus-visible {
        outline: 2px solid #8a6a47;
        outline-offset: 3px;
      }
    </style>
  </head>
  <body>
    <main>
      <div class="mark">
        <svg viewBox="0 0 48 56" width="36" height="42" fill="currentColor" aria-hidden="true">
          <path d="M13 12c0-3.5 4.9-6 11-6s11 2.5 11 6H13Z" />
          <rect x="21.5" y="2.5" width="5" height="4" rx="1.5" />
          <rect x="11.5" y="13.5" width="25" height="6" rx="1.5" />
          <path d="M14 21h20l-2.2 27.5c-.15 1.9-1.7 3.5-3.6 3.5h-8.4c-1.9 0-3.45-1.6-3.6-3.5L14 21Z" />
        </svg>
      </div>
      <h1>You're offline</h1>
      <p>
        Craffé needs a connection to load the menu and send your order. Your bag is saved on this
        device, so nothing is lost.
      </p>
      <button type="button" onclick="location.reload()">Try again</button>
    </main>
    <script>
      // Pick up where they left off the moment the signal returns.
      window.addEventListener("online", function () {
        location.reload();
      });
    </script>
  </body>
</html>
